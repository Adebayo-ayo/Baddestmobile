<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Payload</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #050505; color: #00FF41; 
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; perspective: 1000px;
        }

        /* --- THE ENVELOPE --- */
        .envelope-container {
            position: relative; width: 340px; height: 220px; cursor: pointer; z-index: 10;
            transform: translate(var(--evade-x, 0px), var(--evade-y, 0px)) scale(var(--scale, 1)) rotate(var(--rot, 0deg));
            transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.255), filter 0.2s;
        }

        .envelope-container:hover { --scale: 1.05; --rot: -2deg; filter: drop-shadow(0 0 25px rgba(0, 255, 65, 0.5)); }

        .baddest-label {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Cinzel Decorative', Georgia, serif; font-size: 2.8rem; font-weight: 700;
            color: #00FF41; text-shadow: 0 0 15px rgba(0, 255, 65, 0.8), 0 0 30px rgba(0, 255, 65, 0.4);
            z-index: 5; pointer-events: none; letter-spacing: 2px; transition: opacity 0.3s ease;
        }

        .envelope-body {
            position: absolute; inset: 0; background-color: #010409;
            border: 2px solid #00FF41; display: flex; justify-content: center;
            align-items: flex-end; padding-bottom: 20px;
        }

        .warning-text {
            color: #00FF41; font-weight: bold; animation: pulse 1.5s infinite;
            pointer-events: none; font-size: 0.85rem; letter-spacing: 1px;
            z-index: 5; transition: color 0.3s; text-align: center; max-width: 90%;
        }

        .flap { position: absolute; width: 0; height: 0; }
        .top-flap {
            top: 0; left: 0; border-top: 110px solid #111;
            border-left: 170px solid transparent; border-right: 170px solid transparent;
            transform-origin: top; transition: transform 0.4s ease-in-out; z-index: 4;
        }
        .bottom-flap {
            bottom: 0; left: 0; border-bottom: 110px solid #1a1a1a;
            border-left: 170px solid transparent; border-right: 170px solid transparent; z-index: 3;
        }
        .left-flap {
            top: 0; left: 0; border-left: 170px solid #0d1117;
            border-top: 110px solid transparent; border-bottom: 110px solid transparent; z-index: 2;
        }
        .right-flap {
            top: 0; right: 0; border-right: 170px solid #0d1117;
            border-top: 110px solid transparent; border-bottom: 110px solid transparent; z-index: 2;
        }

        .envelope-container.open .top-flap { transform: rotateX(180deg); }
        .envelope-container.open .baddest-label,
        .envelope-container.open .warning-text { opacity: 0; transition: opacity 0.2s ease; }
        .envelope-container.explode { animation: shatter 0.5s forwards; pointer-events: none; }

        @keyframes panting {
            0%, 100% { transform: translate(var(--evade-x, 0px), var(--evade-y, 0px)) scale(1) rotate(-1deg); }
            50% { transform: translate(var(--evade-x, 0px), calc(var(--evade-y, 0px) + 6px)) scale(0.96) rotate(1deg); }
        }
        .envelope-container.fatigued { animation: panting 0.35s infinite ease-in-out; filter: drop-shadow(0 0 25px rgba(255, 123, 114, 0.4)); }

        /* --- THE HACKER TERMINAL --- */
        #terminal {
            position: absolute; width: 90%; max-width: 800px;
            background-color: #010409; padding: 30px; border-radius: 8px;
            box-shadow: 0px 0px 40px rgba(0, 255, 65, 0.2); border: 1px solid #30363d;
            min-height: 450px; opacity: 0; transform: translateY(100px) scale(0.8) rotateX(-20deg);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5; pointer-events: none;
        }

        #terminal.revealed {
            opacity: 1; transform: translateY(0) scale(1) rotateX(0deg);
            z-index: 20; pointer-events: auto; max-height: 90vh; overflow-y: auto;
        }

        .line { margin: 8px 0; font-size: 1.1rem; line-height: 1.4; }
        .cursor { display: inline-block; width: 10px; height: 1.2rem; background-color: #00FF41; vertical-align: middle; animation: blink 1s step-end infinite; }
        .cake { color: #FF69B4; white-space: pre; font-size: 1.3rem; margin-top: 20px; font-weight: bold; }
        .code-block { color: #5CE1E6; margin-top: 20px; white-space: pre; }
        .highlight { color: #ff7b72; }
        .unlocked-mode { animation: systemShock 0.4s; box-shadow: 0px 0px 60px rgba(255, 105, 180, 0.4) !important; border-color: #FF69B4 !important; }
        .flash { position: fixed; inset: 0; background-color: #00FF41; opacity: 0; z-index: 999; pointer-events: none; }
        .flash.active { animation: flashBang 0.6s ease-out; }

        .particle { position: absolute; color: #00FF41; font-weight: bold; font-size: 1.2rem; pointer-events: none; z-index: 100; text-shadow: 0 0 5px #00FF41; animation: shoot var(--duration) ease-out forwards; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 600px) {
            .envelope-container { transform: translate(var(--evade-x, 0px), var(--evade-y, 0px)) scale(calc(var(--scale, 1) * 0.85)) rotate(var(--rot, 0deg)); }
            .envelope-container:hover { --scale: 0.9; }
            #terminal { padding: 15px; min-height: 350px; }
            .line { font-size: 0.85rem; margin: 6px 0; }
            .code-block { font-size: 0.85rem; }
            .cake { font-size: 1rem; margin-top: 10px; }
            .cursor { height: 1rem; }
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes flashBang { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes shatter { 0% { transform: scale(var(--scale, 1)); opacity: 1; filter: brightness(2); } 20% { transform: scale(calc(var(--scale, 1) + 0.2)) rotate(5deg); } 100% { transform: scale(0) rotate(-15deg); opacity: 0; } }
        @keyframes shoot { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } }
        @keyframes systemShock { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

    <div class="flash" id="flash"></div>

    <div class="envelope-container" id="envelope">
        <div class="baddest-label">Baddest!</div>
        <div class="envelope-body">
            <span class="warning-text">CLICK TO DECRYPT</span>
        </div>
        <div class="flap left-flap"></div>
        <div class="flap right-flap"></div>
        <div class="flap bottom-flap"></div>
        <div class="flap top-flap"></div>
    </div>

    <div id="terminal">
        <div id="output"></div>
        <span class="cursor" id="cursor"></span>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const flash = document.getElementById('flash');
        const terminalBox = document.getElementById('terminal');
        const output = document.getElementById('output');
        const cursor = document.getElementById('cursor');
        const warning = document.querySelector('.warning-text');

        let isOpened = false;
        let lineIndex = 0;
        let isWaiting = false;
        let escapeCount = 0;
        const maxEscapes = 12; 
        let fatigued = false;
        let isEvading = false;

        const evadeTaunts = [
            "ACCESS DENIED!",
            "NO TOUCHY!",
            "TOO SLOW!",
            "SYSTEM DODGING!",
            "CATCH ME IF YOU CAN!",
            "NICE TRY!",
            "ERROR 404: FINGER NOT FOUND",
            "RECALIBRATING EVASION MATRIX...",
            "IS THAT ALL YOU'VE GOT?",
            "EVASION LEVEL: EXPERT",
            "OK... CPU OVERHEATING...",
            "OUT OF RAM... ALMOST DONE...",
            "FINE... YOU WIN. TAP ME!"
        ];

        function handleInteractionTracker(clientX, clientY) {
            if (isOpened || fatigued || isEvading) return;
            const rect = envelope.getBoundingClientRect();
            const envelopeCenterX = rect.left + rect.width / 2;
            const envelopeCenterY = rect.top + rect.height / 2;
            const distance = Math.hypot(clientX - envelopeCenterX, clientY - envelopeCenterY);

            if (distance < 185) {
                triggerEvasion(clientX, clientY);
            }
        }

        // Desktop tracking
        document.addEventListener('mousemove', (e) => { handleInteractionTracker(e.clientX, e.clientY); });
        
        // General mobile touch tracking
        document.addEventListener('touchstart', (e) => { handleInteractionTracker(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        document.addEventListener('touchmove', (e) => { handleInteractionTracker(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        // --- THE MOBILE FIX ---
        // Intercept a direct tap right on the envelope before it can become a click
        envelope.addEventListener('touchstart', (e) => {
            if (isOpened || fatigued) return; 
            e.preventDefault(); // Kills the click entirely
            triggerEvasion(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Evasion displacement
        function triggerEvasion(cursorX, cursorY) {
            isEvading = true;
            escapeCount++;

            if (escapeCount >= maxEscapes) {
                fatigued = true;
                envelope.classList.add('fatigued');
                warning.innerText = evadeTaunts[maxEscapes] || "TIRED... OK, TAP ME!";
                warning.style.color = "#ff7b72";
                envelope.style.setProperty('--evade-x', '0px');
                envelope.style.setProperty('--evade-y', '0px');
                setTimeout(() => { isEvading = false; }, 200);
                return;
            }

            warning.innerText = evadeTaunts[escapeCount - 1] || "SYSTEM DODGING!";
            const margin = 50; 
            const halfWidth = (window.innerWidth - 340) / 2 - margin;
            const halfHeight = (window.innerHeight - 220) / 2 - margin;

            let targetX = (Math.random() - 0.5) * 2 * halfWidth;
            let targetY = (Math.random() - 0.5) * 2 * halfHeight;

            const projectedWorldX = window.innerWidth / 2 + targetX;
            const projectedWorldY = window.innerHeight / 2 + targetY;
            const cursorDistToTarget = Math.hypot(cursorX - projectedWorldX, cursorY - projectedWorldY);

            if (cursorDistToTarget < 200) { targetX = -targetX; targetY = -targetY; }

            envelope.style.setProperty('--evade-x', `${targetX}px`);
            envelope.style.setProperty('--evade-y', `${targetY}px`);
            envelope.style.setProperty('--scale', '0.9');
            
            setTimeout(() => {
                envelope.style.setProperty('--scale', '1');
                isEvading = false;
            }, 180);
        }

        const bootSequence = [
            "Initiating root access...",
            "Bypassing mainframe firewalls... [OK]",
            "Injecting surprise_payload.exe...",
            "<span class='highlight'>WARNING: Unhandled exception detected in age.var!</span>",
            "Manual override required.",
            " ",
            "-> TAP ANYWHERE TO DEBUG AND COMPILE SURPRISE..."
        ];

        const surpriseSequence = [
            " ",
            "Debugging complete. No syntax errors found.",
            "User profile decrypted: <span class='highlight'>Adewale Hamdalat</span>",
            "Alias matched: <span class='highlight'>Baddest!</span>",
            "Compiling user upgrades...",
            "<div class='code-block'>while (alive) {\n  eat();\n  sleep();\n  code();\n  levelUp();\n}</div>",
            "<div class='cake'>\n    ,,,,, \n   _|||||_ \n  {~*~*~*~} \n __{*~*~*~*}__\n `-------------`\n</div>",
            "HAPPY ALGORITHM DAY, BADDEST! Age++ executed successfully. 🚀",
            " ",
            "<span class='highlight'>--- INCOMING TRANSMISSION FOR Hamdalat ---</span>",
            "May your code always compile on the first run, and your servers never crash.",
            "I pray this new year brings you endless prosperity, answered prayers, and boundless joy.",
            "May God's favor surround you, granting you peace, good health, and success in all your endeavors.",
            "Keep shining, keep building, and have the most amazing birthday!",
            "Have a nice day 🤭🤣😅🤣"

        ];

        // --- THE CLICK FIX ---
        envelope.addEventListener('click', (e) => {
            if (isOpened) return;

            // If it's not tired yet, refuse to open! Force the jump instead.
            if (!fatigued) {
                triggerEvasion(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);
                return;
            }

            isOpened = true;
            envelope.classList.remove('fatigued');
            envelope.classList.add('open');

            setTimeout(() => {
                flash.classList.add('active');
                envelope.classList.add('explode');
                spawnParticles(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);

                setTimeout(() => {
                    terminalBox.classList.add('revealed');
                    setTimeout(runBoot, 800);
                }, 400);
            }, 400);
        });

        function spawnParticles(x, y) {
            const particleCount = 80;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.innerText = Math.random() > 0.5 ? '1' : '0';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const velocity = 150 + Math.random() * 300;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = (Math.random() - 0.5) * 720;
                const duration = 0.5 + Math.random() * 0.8;

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.setProperty('--rot', `${rot}deg`);
                particle.style.setProperty('--duration', `${duration}s`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), duration * 1000);
            }
        }

        function typeLine(text, isHtml = false, callback) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'line';
            output.appendChild(lineDiv);
            
            if (isHtml || text.includes('<')) {
                lineDiv.innerHTML = text;
                if(callback) setTimeout(callback, 600);
                return;
            }

            let charIndex = 0;
            const typingInterval = setInterval(() => {
                lineDiv.textContent += text.charAt(charIndex);
                charIndex++;
                if (charIndex >= text.length) {
                    clearInterval(typingInterval);
                    if (callback) setTimeout(callback, 400);
                }
            }, 30);
        }

        function runBoot() {
            if (lineIndex < bootSequence.length) {
                typeLine(bootSequence[lineIndex], false, runBoot);
                lineIndex++;
            } else {
                isWaiting = true; 
            }
        }

        function triggerSurprise() {
            isWaiting = false;
            terminalBox.classList.add('unlocked-mode');
            
            let sIndex = 0;
            function runSurprise() {
                if (sIndex < surpriseSequence.length) {
                    const line = surpriseSequence[sIndex];
                    typeLine(line, false, runSurprise);
                    sIndex++;
                    terminalBox.scrollTop = terminalBox.scrollHeight; // Auto-scrolls on mobile
                } else {
                    cursor.style.display = 'none';
                }
            }
            runSurprise();
        }

        document.addEventListener('keydown', () => { if (isWaiting) triggerSurprise(); });
        document.addEventListener('click', () => { if (isWaiting) triggerSurprise(); });

    </script>
</body>
</html>
